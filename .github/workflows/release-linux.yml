name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS (Apple Silicon arm64) at the PHP
# versions in the matrix (NTS only; ZTS lives in the Windows lane), gates
# them, and uploads each as a release asset using PIE's pre-packaged-binary
# naming convention. Assets upload only after every build and gate passes.
#
# Each lane compiles against the oldest patch release of its minor, built
# from the checksum-pinned php.net tarball. Patch releases add ZEND_API
# functions and call them from inline header code (8.4.27 and 8.5.12 route
# smart_str_alloc() through smart_str_ferealloc()), so a module built
# against newer headers imports symbols an older patch does not export and
# dies with "undefined symbol". 8.4.1 is the oldest 8.4: 8.4.0 was never
# released. Source builds are unaffected; they compile against the PHP
# they load into. The test suite runs the shipped module on setup-php's
# current patch; the Linux gate also loads it on the oldest and a pinned
# newest patch image, and macOS loads it on the oldest-patch build PHP and
# on setup-php's.
#
# workflow_dispatch builds and gates on each OS/arch as a pre-tag
# validation gate; with a blank release_tag it is build-and-gate only and
# safe to run against a branch. A release_tag also uploads the gated
# binaries to that existing release.
#
# macOS Intel (macos-13) is absent: GitHub's Intel runner pool is too
# contended to ship reliably, and macOS 26 drops Intel.
# Linux musl (Alpine) is intentionally absent. Both get PIE's
# composer-default source-build fallback.
#
# composer.json declares
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# so PIE prefers the prebuilt asset and falls back to source-build when no
# asset matches (older PHP, Intel macOS, Alpine, other arches).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build + upload assets to (e.g. backfilling a tag cut before this workflow existed). Leave blank for build-only validation of the current branch.'
        required: false
        default: ''

permissions: {}

env:
  MACOSX_DEPLOYMENT_TARGET: '14.0'

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Full-matrix PHPT + codegen/parity on the release ref, then the ABI gate.
  # No release assets are uploaded here: a failed cell must block *all*
  # publishing (see upload job).
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-15 (Apple Silicon arm64). Pinned over `*-latest` to avoid
        # silent runner shifts that would change the toolchain / glibc
        # baseline on published release assets without a repo diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
        php: ['8.4', '8.5']
        # php-src: the oldest patch release of the minor, which the
        # binaries are built against. Hashes are the php.net-published
        # tar.xz SHA-256s. oldest-image/newest-image: official images (via
        # the ECR Public mirror of Docker Hub's library/php) the Linux gate
        # loads each binary on, pinned by index digest. Move newest-image
        # to each new patch release.
        include:
          - php: '8.4'
            php-src: '8.4.1'
            php-src-sha256: 94c8a4fd419d45748951fa6d73bd55f6bdf0adaefb8814880a67baa66027311f
            oldest-image: public.ecr.aws/docker/library/php:8.4.1-cli@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4
            newest-image: public.ecr.aws/docker/library/php:8.4.27-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
          - php: '8.5'
            php-src: '8.5.0'
            php-src-sha256: 39cb6e4acd679b574d3d3276f148213e935fc25f90403eb84fb1b836a806ef1e
            oldest-image: public.ecr.aws/docker/library/php:8.5.0-cli@sha256:fb551f94cba4698612c90158aa7d4fe8e1a5355f9c444d0f90929d366fc75b36
            newest-image: public.ecr.aws/docker/library/php:8.5.12-cli@sha256:635a4b998025ab269194639a5549c6fdcd9b4f88ec8cd761b092de8653d40663
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the release's tagged source: the tag on a release event, or
          # the dispatch input when backfilling. Blank (plain dispatch) checks
          # out the triggering branch for build-only validation.
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Verify release checkout
        if: github.event.release.tag_name || inputs.release_tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          checked_out_tag=$(git describe --tags --exact-match)
          test "$checked_out_tag" = "$RELEASE_TAG"
          source_version=$(sed -n 's/^#define PHP_PHONETIC_VERSION "\([^"]*\)"/\1/p' php_phonetic.h)
          test "$source_version" = "$RELEASE_TAG"

      # The source under release may predate the gate scripts, so they come
      # from the workflow's own commit.
      - name: Check out gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-gate
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize
          coverage: none

      - name: Codegen + arginfo freshness (one cell is enough; run on ubuntu x86_64)
        if: matrix.os == 'ubuntu-24.04' && matrix.php == '8.4'
        run: |
          set -euo pipefail
          php scripts/gen_bmpm_data.php
          git diff --exit-code src/bmpm_data.h src/dm_data.h
          php scripts/check_arginfo.php

      - name: Commons Codec parity
        if: matrix.os == 'ubuntu-24.04' && matrix.php == '8.4'
        run: |
          set -euo pipefail
          phpize
          ./configure --enable-phonetic --enable-phonetic-dev
          make -j"$(getconf _NPROCESSORS_ONLN)"
          php -d extension="$(pwd)/modules/phonetic.so" scripts/oracle/parity/check.php
          git clean -xdf .

      # Kept off PATH: phpize and php-config are called by absolute path,
      # and `php` stays setup-php's for the test suite.
      - name: Build PHP ${{ matrix.php-src }} headers and binary
        env:
          PHP_SRC: ${{ matrix.php-src }}
          PHP_SRC_SHA256: ${{ matrix.php-src-sha256 }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/php-$PHP_SRC.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" "https://www.php.net/distributions/php-$PHP_SRC.tar.xz"
          echo "$PHP_SRC_SHA256  $tarball" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/php-src"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/php-src" --strip-components=1
          cd "$RUNNER_TEMP/php-src"
          # The ABI smoke needs only always-enabled extensions (standard).
          ./configure --prefix="$RUNNER_TEMP/php" --disable-all --enable-cli \
            --disable-cgi --disable-phpdbg --without-pear >"$RUNNER_TEMP/php-configure.log"
          make -j"$(getconf _NPROCESSORS_ONLN)" >"$RUNNER_TEMP/php-make.log" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/php-make.log"; exit 1; }
          make install >/dev/null

      - name: Verify build and test PHP
        env:
          PHP_SRC: ${{ matrix.php-src }}
          PHP_MINOR: ${{ matrix.php }}
        run: |
          set -euo pipefail
          build_php="$RUNNER_TEMP/php/bin"
          test "$("$build_php/php-config" --version)" = "$PHP_SRC"
          test "$("$build_php/php" -n -r 'echo PHP_VERSION;')" = "$PHP_SRC"
          test "$("$build_php/php" -n -r 'echo (int) PHP_ZTS, (int) PHP_DEBUG;')" = "00"
          test "$(php -n -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_MINOR"
          test "$(php -n -r 'echo (int) PHP_ZTS, (int) PHP_DEBUG;')" = "00"
          echo "build PHP $PHP_SRC; test PHP $(php -n -r 'echo PHP_VERSION;') at $(command -v php)"

      - name: Build extension against PHP ${{ matrix.php-src }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/php/bin/phpize"
          ./configure --enable-phonetic --enable-phonetic-dev \
            --with-php-config="$RUNNER_TEMP/php/bin/php-config"
          make -j"$(getconf _NPROCESSORS_ONLN)"

      # Test the module that ships, on setup-php's current patch, before any
      # upload. On a plain dispatch this plus the ABI gate is the complete
      # validation path; release/backfill runs upload only after the full
      # matrix succeeds (upload job needs: build).
      - name: Test shipped binary
        run: |
          set -euo pipefail
          export TEST_PHP_EXECUTABLE=$(command -v php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/phonetic.so"
          export NO_INTERACTION=1
          php $TEST_PHP_ARGS -r 'exit(extension_loaded("phonetic") ? 0 : 1);' \
            || { echo "::error::phonetic extension failed to load"; exit 1; }
          RESULT=$(php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1)
          echo "$RESULT"
          num() { awk -v k="$1" '$0 ~ ("^Tests " k) { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { print $i; exit } }' <<<"$RESULT"; }
          PASSED=$(num passed); FAILED=$(num failed); SKIPPED=$(num skipped)
          BORKED=$(num borked); LEAKED=$(num leaked)
          : "${PASSED:=0}" "${FAILED:=0}" "${SKIPPED:=0}" "${BORKED:=0}" "${LEAKED:=0}"
          if [ "$FAILED" -gt 0 ] || [ "$BORKED" -gt 0 ] || [ "$LEAKED" -gt 0 ]; then
            echo "::error::failed=$FAILED borked=$BORKED leaked=$LEAKED"; exit 1
          fi
          if [ "$PASSED" -eq 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "::error::suite not effective: passed=$PASSED skipped=$SKIPPED"; exit 1
          fi

      - name: Package binary
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # php/pie-ext-binary-builder's naming:
          # php_<ext>-<tag>_php<X.Y>-<arch>-<os>-<libc>[-debug][-zts].zip
          # A plain dispatch has no tag; it names the package by the source
          # version and never uploads it.
          tag=${RELEASE_TAG:-$(sed -n 's/^#define PHP_PHONETIC_VERSION "\([^"]*\)"/\1/p' php_phonetic.h)}
          test -n "$tag"
          build_php="$RUNNER_TEMP/php/bin"
          minor=$("$build_php/php-config" --version | cut -d. -f1,2)
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          case "$(uname -s)" in
            Linux) os=linux; libc=glibc ;;
            Darwin) os=darwin; libc=bsdlibc ;;
            *) echo "::error::unsupported OS $(uname -s)"; exit 1 ;;
          esac
          suffix=$("$build_php/php" -n -r "echo PHP_DEBUG ? '-debug' : '', ZEND_THREAD_SAFE ? '-zts' : '';")
          name="php_phonetic-${tag}_php${minor}-${arch}-${os}-${libc}${suffix}.zip"
          mkdir -p "$RUNNER_TEMP/dist"
          zip -j "$RUNNER_TEMP/dist/$name" modules/phonetic.so
          mkdir "$RUNNER_TEMP/packaged"
          unzip -q "$RUNNER_TEMP/dist/$name" -d "$RUNNER_TEMP/packaged"
          test -f "$RUNNER_TEMP/packaged/phonetic.so"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The build PHP is the oldest patch of the minor, so loading the
      # packaged module into it and into setup-php's current patch covers
      # both ends. nm cannot attribute imports here: the module uses flat
      # namespace lookup and the system libraries live in the dyld cache.
      - name: Gate on the oldest and newest patch (macOS)
        if: runner.os == 'macOS'
        run: |
          # GitHub runs bash with -e; a failed load must still print its
          # output and fall through to the status checks.
          set +e
          set -uo pipefail
          module="$RUNNER_TEMP/packaged/phonetic.so"
          status=0
          for php_bin in "$RUNNER_TEMP/php/bin/php" "$(command -v php)"; do
            want=$("$php_bin" -n -r 'echo PHP_VERSION;')
            echo "== load and smoke on $php_bin (PHP $want)"
            out=$("$php_bin" -n -d extension="$module" .release-gate/scripts/prebuilt-abi-smoke.php 2>&1)
            rc=$?
            printf '%s\n' "$out"
            if [[ $rc -ne 0 ]]; then
              echo "::error::smoke on PHP $want exited with status $rc"
              status=1
            elif grep -qiE 'symbol not found|undefined symbol' <<< "$out"; then
              echo "::error::smoke on PHP $want reported an unresolved symbol"
              status=1
            elif ! grep -qF "ok php=$want " <<< "$out"; then
              echo "::error::smoke on PHP $want did not report PHP $want"
              status=1
            fi
          done
          exit "$status"

      - name: Gate on the oldest and newest patch (Linux)
        if: runner.os == 'Linux'
        env:
          OLDEST_IMAGE: ${{ matrix.oldest-image }}
          NEWEST_IMAGE: ${{ matrix.newest-image }}
        run: |
          .release-gate/scripts/prebuilt-abi-smoke.sh \
            "$RUNNER_TEMP/packaged/phonetic.so" "$OLDEST_IMAGE" "$NEWEST_IMAGE"

      - name: Store gated binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.os }}-php${{ matrix.php }}
          path: ${{ runner.temp }}/dist/${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  # Upload only after every build matrix cell succeeded. Prevents a partial
  # release when one OS/PHP cell fails while others already finished.
  upload:
    name: Upload release assets
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Uploads Linux/macOS prebuilt .so assets to the GitHub Release.
    steps:
      - name: Fetch gated binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilt-*
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::no gated binaries to upload"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
