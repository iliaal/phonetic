name: Release Windows binaries

# Triggered when a GitHub Release is published (manual or from a tag push
# via /release-ext). Builds the extension on every supported PHP version
# x architecture x thread-safety variant on Windows runners, then uploads
# each .dll as a release asset following the PIE-compatible naming
# convention. All phonetic rule data is compiled in, so there is no
# external DLL to bundle.
#
# Each matrix build runs PHPT against the release tag before the upload job can
# publish its binary. Each cell also re-checks codegen freshness, Commons Codec
# parity, and the fail-closed skip guard, so a bad cell blocks the upload.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-windows-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve Windows release matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5'

  build:
    name: Build ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'true'
          args: '--enable-phonetic --enable-phonetic-dev'

      - name: Assert Windows DLL was produced
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Recurse -Filter "php_phonetic.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dll) {
            Write-Host "::error::php_phonetic.dll not found after Windows build"
            exit 1
          }
          Write-Host "Found $($dll.FullName)"
      - name: Locate lane php.exe
        shell: bash
        run: |
          set -euo pipefail
          # The builder layout differs across jobs; probe each php.exe under
          # build/ plus PATH and keep the first that loads this lane's DLL.
          dll="$(find "$PWD" -name "php_phonetic.dll" | head -n 1)"
          test -n "$dll" || { echo "::error::php_phonetic.dll not found"; exit 1; }
          echo "PHONETIC_DLL=$dll" >>"$GITHUB_ENV"
          while IFS= read -r cand; do
            [ -n "$cand" ] || continue
            if "$cand" -n -d "extension=$(cygpath -w "$dll")" -r 'exit(extension_loaded("phonetic") ? 0 : 1);' >/dev/null 2>&1; then
              echo "PHONETIC_PHP=$cand" >>"$GITHUB_ENV"
              echo "using $cand"
              exit 0
            fi
          done < <(find build -name "php.exe" 2>/dev/null; command -v php || true)
          echo "::error::no php.exe loads the lane DLL"; exit 1
      - name: Codegen + arginfo freshness
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PHONETIC_PHP:-}" || { echo "::error::PHONETIC_PHP not set"; exit 1; }
          "$PHONETIC_PHP" scripts/gen_bmpm_data.php
          git diff --exit-code src/bmpm_data.h src/dm_data.h
          "$PHONETIC_PHP" scripts/check_arginfo.php
      - name: Commons Codec parity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PHONETIC_PHP:-}" || { echo "::error::PHONETIC_PHP not set"; exit 1; }
          dll="$(find "$PWD" -name "php_phonetic.dll" | head -n 1)"
          test -n "$dll" || { echo "::error::php_phonetic.dll not found"; exit 1; }
          "$PHONETIC_PHP" -d "extension=$(cygpath -w "$dll")" scripts/oracle/parity/check.php
      - name: Re-run tests with fail-closed skip guard
        shell: bash
        run: |
          set -euo pipefail
          # run-tests.php exits 0 on an all-SKIP run, so the builder step above
          # cannot gate on it. Mirror the Linux counts: fail on any
          # skip/bork/leak/failure or an empty pass count.
          dll="$(find "$PWD" -name "php_phonetic.dll" | head -n 1)"
          test -n "$dll" || { echo "::error::php_phonetic.dll not found"; exit 1; }
          dllwin="$(cygpath -w "$dll")"
          # build/php-bin/php.exe is one arch/ts flavor and cannot load every
          # lane's DLL (%1 is not a valid Win32 application on mismatch), so
          # probe each php.exe under build/ plus PATH and use the first that
          # loads this lane's DLL.
          phpbin=""
          while IFS= read -r cand; do
            [ -n "$cand" ] || continue
            if "$cand" -n -d "extension=$dllwin" -r 'exit(extension_loaded("phonetic") ? 0 : 1);' >/dev/null 2>&1; then
              phpbin="$cand"
              break
            fi
          done < <(find build -name "php.exe" 2>/dev/null; command -v php || true)
          test -n "$phpbin" || { echo "::error::no php.exe loads $dllwin"; exit 1; }
          runner="build/run-tests.php"
          if [ ! -f "$runner" ]; then
            runner="$(find . -name "run-tests.php" -not -path "./vendor/*" | head -n 1)"
            test -n "$runner" || { echo "::error::run-tests.php not found"; exit 1; }
          fi
          runnerwin="$(cygpath -w "$runner")"
          "$phpbin" -n -d "extension=$dllwin" -r 'exit(extension_loaded("phonetic") ? 0 : 1);' \
            || { echo "::error::phonetic extension failed to load"; exit 1; }
          export TEST_PHP_EXECUTABLE="$(cygpath -w "$phpbin")"
          export TEST_PHP_ARGS="-n -d extension=$dllwin"
          export NO_INTERACTION=1
          RESULT="$("$phpbin" "$runnerwin" --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1)" || true
          echo "$RESULT"
          num() { awk -v k="$1" '$0 ~ ("^Tests " k) { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { print $i; exit } }' <<<"$RESULT"; }
          PASSED=$(num passed); FAILED=$(num failed); SKIPPED=$(num skipped)
          BORKED=$(num borked); LEAKED=$(num leaked)
          : "${PASSED:=0}" "${FAILED:=0}" "${SKIPPED:=0}" "${BORKED:=0}" "${LEAKED:=0}"
          echo "passed=$PASSED failed=$FAILED skipped=$SKIPPED borked=$BORKED leaked=$LEAKED"
          if [ "$FAILED" -gt 0 ] || [ "$BORKED" -gt 0 ] || [ "$LEAKED" -gt 0 ]; then
            echo "::error::failed=$FAILED borked=$BORKED leaked=$LEAKED"; exit 1
          fi
          if [ "$PASSED" -eq 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "::error::suite not effective: passed=$PASSED skipped=$SKIPPED"; exit 1
          fi
  release:
    name: Upload binaries to the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # GITHUB_TOKEN defaults to read-only for `contents:` on newer repos;
    # asset upload needs write or it 403s.
    permissions:
      contents: write # Uploads Windows binaries and license files to the release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload third-party license and notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" LICENSE-APACHE NOTICE --clobber
