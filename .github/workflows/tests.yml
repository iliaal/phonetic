name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --strict

  # PIE install-path smoke against a path repository pointing at this checkout.
  # Catches composer.json php-ext metadata drift and configure-options the
  # config.m4 doesn't actually understand.
  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin
      - name: Download PIE
        run: |
          # Pin a release tag so CI is not a moving target (latest.phar can
          # change under our feet). Bump intentionally when upgrading PIE.
          curl -fsSL -o /tmp/pie.phar \
            https://github.com/php/pie/releases/download/1.4.9/pie.phar
          chmod +x /tmp/pie.phar
          php /tmp/pie.phar --version
      - name: PIE build smoke
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/phonetic:*@dev --enable-phonetic
      - name: Functional smoke (load + encode + match)
        run: |
          # pie build validates the package metadata path; still exercise the
          # actual .so via a classic phpize build so a load/API regression fails
          # this job even if pie only compiled.
          set -euo pipefail
          phpize
          ./configure --enable-phonetic
          make -j"$(nproc)"
          php -d extension="$(pwd)/modules/phonetic.so" -r '
            if (!extension_loaded("phonetic")) { fwrite(STDERR, "load failed\n"); exit(1); }
            $dm = double_metaphone("Smith");
            if (($dm["primary"] ?? "") !== "SM0") { fwrite(STDERR, "dm mismatch\n"); exit(1); }
            if (!bmpm_match("Jackson", "Jaxon")) { fwrite(STDERR, "bmpm_match true failed\n"); exit(1); }
            if (bmpm_match("Smith", "Xylophone")) { fwrite(STDERR, "bmpm_match false failed\n"); exit(1); }
            if (double_metaphone_match("Catherine", "Kathryn") !== 2) { fwrite(STDERR, "dmet strength failed\n"); exit(1); }
            if (double_metaphone_match("Smith", "Xylophone") !== 0) { fwrite(STDERR, "dmet no-match failed\n"); exit(1); }
            echo "pie functional smoke ok\n";
          '

  # The BMPM / Daitch-Mokotoff C tables (src/bmpm_data.h) are generated from the
  # vendored rule files. Regenerate and fail if the checked-in header is stale,
  # so a vendor-data or generator edit can't ship out-of-sync tables.
  codegen:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          coverage: none
      - name: Regenerate src/bmpm_data.h from vendored rule data
        run: php scripts/gen_bmpm_data.php
      - name: Fail if the checked-in header is stale
        run: git diff --exit-code src/bmpm_data.h
      - name: Verify arginfo matches phonetic.stub.php
        run: php scripts/check_arginfo.php

  # Compare every configured mode/word pair against a frozen Apache Commons
  # Codec 1.17.1 golden. The checker rejects incomplete or duplicate fixtures,
  # so deleting rows cannot weaken this gate silently. No Java is needed here.
  parity:
    name: Commons Codec parity
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: phpize, php-config
      - name: Build extension
        run: |
          phpize
          ./configure --enable-phonetic --enable-phonetic-dev
          make -j$(nproc)
      - name: Check parity against frozen Commons golden
        run: php -d extension="$(pwd)/modules/phonetic.so" scripts/oracle/parity/check.php

  linux:
    name: PHP ${{ matrix.php }} - Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure --enable-phonetic --enable-phonetic-dev
          WARNINGS=$(make -j$(nproc) 2>&1 | tee /dev/stderr | grep -c 'warning:' || true)
          if [ "$WARNINGS" -gt 0 ]; then
            echo "::error::Build produced $WARNINGS warning(s)"
            exit 1
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/phonetic.so"
          export NO_INTERACTION=1
          # Every .phpt has `--EXTENSIONS-- phonetic`, so a load failure SKIPs the
          # whole suite and run-tests still exits 0. Assert the extension loads,
          # then fail on any skip/bork/leak/failure or an empty pass count.
          php $TEST_PHP_ARGS -r 'exit(extension_loaded("phonetic") ? 0 : 1);' \
            || { echo "::error::phonetic extension failed to load"; exit 1; }
          RESULT=$(php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1)
          echo "$RESULT"
          # Portable parse: BSD grep (macOS) has no -P/\K, so grep -oP would
          # yield empty counts and trip the "not effective" guard on a good run.
          num() { awk -v k="$1" '$0 ~ ("^Tests " k) { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { print $i; exit } }' <<<"$RESULT"; }
          PASSED=$(num passed); FAILED=$(num failed); SKIPPED=$(num skipped)
          BORKED=$(num borked); LEAKED=$(num leaked)
          : "${PASSED:=0}" "${FAILED:=0}" "${SKIPPED:=0}" "${BORKED:=0}" "${LEAKED:=0}"
          echo "passed=$PASSED failed=$FAILED skipped=$SKIPPED borked=$BORKED leaked=$LEAKED"
          if [ "$FAILED" -gt 0 ] || [ "$BORKED" -gt 0 ] || [ "$LEAKED" -gt 0 ]; then
            echo "::error::failed=$FAILED borked=$BORKED leaked=$LEAKED"; exit 1
          fi
          if [ "$PASSED" -eq 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "::error::suite not effective: passed=$PASSED skipped=$SKIPPED"; exit 1
          fi

  macos:
    name: PHP ${{ matrix.php }} - macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Full supported range (matches Linux). ZTS remains Windows-only.
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure --enable-phonetic --enable-phonetic-dev
          make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: |
          set -euo pipefail
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/phonetic.so"
          export NO_INTERACTION=1
          php $TEST_PHP_ARGS -r 'exit(extension_loaded("phonetic") ? 0 : 1);' \
            || { echo "::error::phonetic extension failed to load"; exit 1; }
          RESULT=$(php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1)
          echo "$RESULT"
          # Portable parse: BSD grep (macOS) has no -P/\K, so grep -oP would
          # yield empty counts and trip the "not effective" guard on a good run.
          num() { awk -v k="$1" '$0 ~ ("^Tests " k) { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { print $i; exit } }' <<<"$RESULT"; }
          PASSED=$(num passed); FAILED=$(num failed); SKIPPED=$(num skipped)
          BORKED=$(num borked); LEAKED=$(num leaked)
          : "${PASSED:=0}" "${FAILED:=0}" "${SKIPPED:=0}" "${BORKED:=0}" "${LEAKED:=0}"
          echo "passed=$PASSED failed=$FAILED skipped=$SKIPPED borked=$BORKED leaked=$LEAKED"
          if [ "$FAILED" -gt 0 ] || [ "$BORKED" -gt 0 ] || [ "$LEAKED" -gt 0 ]; then
            echo "::error::failed=$FAILED borked=$BORKED leaked=$LEAKED"; exit 1
          fi
          if [ "$PASSED" -eq 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "::error::suite not effective: passed=$PASSED skipped=$SKIPPED"; exit 1
          fi

  asan:
    name: PHP ${{ matrix.php }} - ASAN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      ASAN_OPTIONS: exitcode=139:verify_asan_link_order=0:detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      USE_TRACKED_ALLOC: 1
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm clang re2c bison autoconf

      # -shared-libasan links binaries against clang's ASAN runtime .so; each ASAN
      # step sets LD_LIBRARY_PATH to this dir so configure's run-test and the
      # instrumented php binary can resolve it (else configure dies at "whether the
      # C compiler works" with "cannot run C compiled programs").
      - name: Resolve clang runtime dir
        id: clang_rt
        run: echo "dir=$(clang -print-runtime-dir)" >> "$GITHUB_OUTPUT"

      - name: Build PHP with ASAN (-shared-libasan keeps __cxa_throw resolvable across dlopen)
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --enable-debug \
            --disable-zts \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-asan
          make -j$(nproc)
          make install

      - name: Build extension with ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          CXXFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --enable-phonetic --enable-phonetic-dev \
            --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run tests under ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          set -euo pipefail
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/phonetic.so"
          export NO_INTERACTION=1
          /tmp/php-asan/bin/php $TEST_PHP_ARGS -r 'exit(extension_loaded("phonetic") ? 0 : 1);' \
            || { echo "::error::phonetic extension failed to load under ASAN"; exit 1; }
          # Capture via redirect (not `| tee ... || true`, which masked the exit
          # status and let an all-skip run pass green under ASAN).
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK tests/ > /tmp/test-output.txt 2>&1 || true
          cat /tmp/test-output.txt
          num() { awk -v k="$1" '$0 ~ ("^Tests " k) { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { print $i; exit } }' /tmp/test-output.txt; }
          PASSED=$(num passed); FAILED=$(num failed); SKIPPED=$(num skipped)
          BORKED=$(num borked); LEAKED=$(num leaked)
          : "${PASSED:=0}" "${FAILED:=0}" "${SKIPPED:=0}" "${BORKED:=0}" "${LEAKED:=0}"
          echo "passed=$PASSED failed=$FAILED skipped=$SKIPPED borked=$BORKED leaked=$LEAKED"
          if [ "$FAILED" -gt 0 ] || [ "$BORKED" -gt 0 ] || [ "$LEAKED" -gt 0 ]; then
            echo "::error::ASAN failed=$FAILED borked=$BORKED leaked=$LEAKED"; exit 1
          fi
          if [ "$PASSED" -eq 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "::error::ASAN suite not effective: passed=$PASSED skipped=$SKIPPED"; exit 1
          fi

  # Mirrors the release-windows.yml matrix (same php-version-list, so the same
  # MSVC toolsets: VS2019 for <=8.3, VS2022 for >=8.4) and runs the test suite,
  # so a Windows compile/test break surfaces on push instead of at release time
  # when the asset upload is all-or-nothing.
  windows-matrix:
    name: Resolve Windows matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5'

  windows:
    name: Windows ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # run-tests.php exits 0 when every test is SKIPPED (extension load
      # failure). Linux/macOS jobs fail-closed on that; this action runs
      # build+tests in one step. Assert the DLL was produced so a total
      # package failure cannot look green. Residual: all-SKIP with a present
      # DLL still depends on the builder's test runner exit policy.
      - uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'true'
          args: '--enable-phonetic'
      - name: Assert Windows DLL was produced
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Recurse -Filter "php_phonetic.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dll) {
            Write-Host "::error::php_phonetic.dll not found after Windows build"
            exit 1
          }
          Write-Host "Found $($dll.FullName)"
